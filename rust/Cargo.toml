[package]
name = "spread-wings"
version = "0.1.0"
edition = "2021"
description = "A broad code graph from syntax alone (the Rust trial; see docs/rust-port.md)"
license = "MIT"

[[bin]]
name = "spread-wings"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
libsqlite3-sys = { version = "0.40.0", features = ["bundled"] }
serde_json = "1.0.154"
tree-sitter = "=0.25.10"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.0"
tree-sitter-typescript = "=0.23.2"

[profile.release]
opt-level = 3
